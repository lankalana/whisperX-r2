[project]
urls = { repository = "https://github.com/m-bain/whisperx" }
authors = [{ name = "Max Bain" }]
name = "whisperx"
version = "3.7.6"
description = "Time-Accurate Automatic Speech Recognition using Whisper."
readme = "README.md"
requires-python = "~=3.12.0"
license = { text = "BSD-2-Clause" }

dependencies = [
    "ctranslate2~=4.7.1",
    "faster-whisper~=1.2.1",
    "nltk~=3.9.2",
    "numpy~=2.4.2",
    "omegaconf~=2.3.0",
    "pandas~=2.3.3",
    "pyannote-audio~=4.0.0",
    "huggingface-hub~=1.3.0",
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "transformers~=5.1.0",
    "triton~=3.4.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "matplotlib>=3.10.8",
]


[project.scripts]
whisperx = "whisperx.__main__:cli"

[build-system]
requires = ["setuptools"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["whisperx*"]

[tool.setuptools.package-data]
whisperx = ["assets/*"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
  { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
  { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
triton = [
  { index = "pytorch", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
